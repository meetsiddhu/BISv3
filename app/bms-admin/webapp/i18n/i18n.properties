# BSI / BHI configuration screen
bhi.title=BSI / BHI Configuration
bhi.note=Configure how the Bridge Structure Index (BSI) and Bridge Health Index (BHI) are calculated. Defaults follow published bridge-health-index practice; every value is overridable and changes are audited. Edits apply on the next BSI/BHI compute (scoreFleet / computeBhi).
bhi.statusCustom=Custom configuration active
bhi.statusDefault=Engine defaults (no overrides)
bhi.btnReset=Reset to defaults
bhi.tab.weights=Element weights
bhi.tab.coeffs=Coefficients
bhi.tab.calibrated=Calibrated modes
bhi.weights.hint=Per transport mode, the relative weight of each element group in the structure index. BSI normalises by total weight, so weights are relative — but each mode should sum to about 1.0.
bhi.weights.sumNote=Σ shown per mode — green when it sums to 1.0 (±0.001), amber otherwise.
bhi.coeffs.hint=Environmental, age, importance and remaining-service-life coefficients applied after the weighted element score.
bhi.calibrated.hint=Only modes flagged as calibrated present their weights as native methodology. Uncalibrated modes (e.g. rail/pedestrian using road-derived weights) are labelled accordingly until a defensible weight set is sourced.
bhi.uncalibrated=road-derived (calibrate)
bhi.col.mode=Transport mode
bhi.col.bucket=Element group
bhi.col.weight=Weight
bhi.col.default=Engine default
bhi.col.coeff=Coefficient
bhi.col.value=Value
bhi.col.controls=What it controls
bhi.col.calibrated=Calibrated
bhi.tab.classWeights=Per-class overrides
bhi.classWeights.hint=Optionally override element weights for a specific asset class (e.g. Culvert) on a transport mode. Where no override exists, the class uses the mode weights above (precedence: class+mode → mode → Road). Each override starts as a copy of the mode weights, which you then tune.
bhi.classWeights.empty=No per-class overrides. All classes use the per-mode element weights. Use "Add class override" to tune a specific asset class.
bhi.classWeights.note=Per-class overrides are optional and additive — removing a row reverts that element group to the mode weight. Applies on the next BSI/BHI compute.
bhi.btnAddClass=Add class override
bhi.col.class=Asset class
bhi.col.modeDefault=Mode weight
action.remove=Remove

